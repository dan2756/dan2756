<svg xmlns="http://www.w3.org/2000/svg" width="148" height="44" viewBox="0 0 148 44">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x="1" y="2" width="146" height="40" rx="20"/></clipPath>
    <style>
      .s { animation: sweep 4.5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(0); } 40%, 100% { transform: translateX(290px); } }
      
    </style>
  </defs>
  <rect x="1" y="2" width="146" height="40" rx="20" fill="#1f2328"/>
  <g clip-path="url(#pill)"><g class="s"><rect x="-90" y="-10" width="56" height="64" fill="url(#g)" transform="skewX(-20)"/></g></g>
  <text x="74" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#ffffff">Open ReelForge</text>
</svg>
