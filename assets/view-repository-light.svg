  <rect class="run" x="1.5" y="2.5" width="167" height="39" rx="19.5" pathLength="100" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linecap="round"/>
  <text x="85" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1f2328">View repository</text>
