<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#151b23"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
    <style>
      .b { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .b2 { animation-duration: 18s; animation-direction: alternate-reverse; }
      .b3 { animation-duration: 22s; }
      @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(-60px,30px) scale(1.15); } }
      @media (prefers-reduced-motion: reduce) { .b { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.45">
      <circle class="b" cx="900" cy="80" r="150" fill="#06b6d4"/>
      <circle class="b b2" cx="1080" cy="230" r="140" fill="#8b5cf6"/>
      <circle class="b b3" cx="760" cy="260" r="110" fill="#f43f5e"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="24" fill="none" stroke="#3d444d"/>
  <text x="72" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-3" fill="#f0f6fc">Hi, I'm DJ</text>
  <text x="76" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="30" fill="#9198a1">I build small tools and personal software.</text>
</svg>
